[project]
name = "langgraph-sql-agent"
version = "0.1.0"
description = "A LangGraph ReAct agent that can run queries on an ephemeral SQLite database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-instrumentation-sqlite3>=0.66b1",
    "opentelemetry-instrumentation-google-genai>=1.2b0",
    "rich>=15.0.0",
]
