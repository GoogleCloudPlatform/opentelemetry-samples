name: PR Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  java-spotless:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Run Spotless Check
      run: |
        cd java
        ./gradlew spotlessCheck

  java-samples-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [otlpmetric, otlptrace, resource, otlp-spring, otlpmetrics-function, autoconf-auth-extension, instrumentation-quickstart]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build Sample
      run: |
        cd java/${{ matrix.sample }}
        ../gradlew build

  go-samples-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [metric/otlpgrpc, trace/otlpgrpc, trace/otlphttp]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.3'
    - name: Build Go Sample
      run: |
        cd golang/${{ matrix.sample }}
        go build -v ./...

  go-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [metric/otlpgrpc, trace/otlpgrpc, trace/otlphttp]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: |
          cd golang/${{ matrix.sample }}
          $(go env GOPATH)/bin/golangci-lint run

  python-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: '3.11'
    - name: Run lint via Makefile
      working-directory: python
      run: make lint


  javascript-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [otlpmetricexport]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        cd javascript/${{ matrix.sample }}
        npm install
    - name: Run Lint
      run: |
        cd javascript/${{ matrix.sample }}
        npm run lint

  javascript-samples-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [otlpmetricexport]
        node-version: [18, 20, 22, 24]
    name: Build JS ${{ matrix.sample }} on Node ${{ matrix.node-version }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: |
        cd javascript/${{ matrix.sample }}
        npm install
    - name: Build Sample
      run: |
        cd javascript/${{ matrix.sample }}
        npm run compile

