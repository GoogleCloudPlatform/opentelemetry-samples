name: PR Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  java-spotless:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Run Spotless Check
      run: |
        cd java
        ./gradlew spotlessCheck

  java-samples-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [otlpmetric, otlptrace, resource, otlp-spring, otlpmetrics-function, autoconf-auth-extension]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build Sample
      run: |
        cd java/${{ matrix.sample }}
        ../gradlew build
