name: PR Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  java-spotless:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Run Spotless Check
      run: |
        cd java
        ./gradlew spotlessCheck

  java-samples-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [otlpmetric, otlptrace, resource, otlp-spring, otlpmetrics-function, autoconf-auth-extension]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build Sample
      run: |
        cd java/${{ matrix.sample }}
        ../gradlew build

  go-samples-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [metric/otlpgrpc]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.3'
    - name: Build Go Sample
      run: |
        cd golang/${{ matrix.sample }}
        go build -v ./...

  go-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [metric/otlpgrpc]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          working-directory: golang/${{ matrix.sample }}

  go-vulncheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [metric/otlpgrpc]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.3'
          working-directory: golang/${{ matrix.sample }}
