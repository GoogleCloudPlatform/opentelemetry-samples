name: PR Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  java-spotless:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up JDK 17
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Run Spotless Check
      run: |
        cd java
        ./gradlew spotlessCheck

  java-samples-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        sample: [otlpmetric, otlptrace, resource, otlp-spring, otlpmetrics-function, autoconf-auth-extension, instrumentation-quickstart, otlpiap]
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up JDK 17
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build Sample
      run: |
        cd java/${{ matrix.sample }}
        ../gradlew build

  go-samples-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        sample: [metric/otlpgrpc, trace/otlpgrpc, trace/otlphttp]
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.26.3'
    - name: Build Go Sample
      run: |
        cd golang/${{ matrix.sample }}
        go build -v ./...

  go-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        sample: [metric/otlpgrpc, trace/otlpgrpc, trace/otlphttp]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.3'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: |
          cd golang/${{ matrix.sample }}
          $(go env GOPATH)/bin/golangci-lint run

  python-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        python-version: '3.11'
    - name: Run lint via Makefile
      working-directory: python
      run: make lint


  javascript-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        sample: [otlpmetricexport, otlptraceexport, instrumentation-quickstart]
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Node
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        cd javascript/${{ matrix.sample }}
        npm install
    - name: Run Lint
      run: |
        cd javascript/${{ matrix.sample }}
        npm run lint

  javascript-samples-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        sample: [otlpmetricexport, otlptraceexport, instrumentation-quickstart]
        node-version: [18, 20, 22, 24]
    name: Build JS ${{ matrix.sample }} on Node ${{ matrix.node-version }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Node ${{ matrix.node-version }}
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: |
        cd javascript/${{ matrix.sample }}
        npm install
    - name: Build Sample
      run: |
        cd javascript/${{ matrix.sample }}
        npm run compile

  cpp-samples-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        sample: [otlpmetric, otlptrace, instrumentation-quickstart]
    name: Build C++ ${{ matrix.sample }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Install dependencies
      run: |
        sudo apt-get update && \
        sudo apt-get install -y --no-install-recommends \
          cmake \
          build-essential \
          libgrpc++-dev \
          protobuf-compiler-grpc \
          libprotobuf-dev \
          protobuf-compiler \
          libcurl4-openssl-dev
    - name: Build Sample
      run: |
        cd cpp/${{ matrix.sample }}
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
        if [ -f build/CTestTestfile.cmake ]; then ctest --test-dir build --output-on-failure; fi
