plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'OpenTelemetry instrumentation quickstart using Spring Boot'

repositories {
	mavenCentral()
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux:3.5.16'

	// Use log4j2 for logging
	// https://docs.spring.io/spring-boot/how-to/logging.html#howto.logging.log4j
	implementation "org.springframework.boot:spring-boot-starter-log4j2:3.5.16"
	modules {
		module("org.springframework.boot:spring-boot-starter-logging") {
			replacedBy("org.springframework.boot:spring-boot-starter-log4j2", "Use Log4j2 instead of Logback")
		}
	}
	implementation "org.apache.logging.log4j:log4j-layout-template-json:2.24.3"

	testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.16'
	testImplementation 'org.testcontainers:testcontainers:2.0.5'
	testImplementation 'com.google.truth:truth:1.4.5'
	testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.5"
}

tasks.named('test') {
	useJUnitPlatform {
		// Individual integration tests are annotated with @Tag('integrationTest')
		excludeTags 'integrationTest'
	}
}

tasks.register("integrationTest", Test) {
	useJUnitPlatform {
		includeTags 'integrationTest'
	}

	// Passing -DcomposeOverrideFile=foo.yaml will merge docker-compose.yaml with foo.yaml.
	// This is used to set overrides for Cloud Build.
	if (System.getProperty('composeOverrideFile')) {
		systemProperty 'composeOverrideFile', System.getProperty('composeOverrideFile')
	}
}
