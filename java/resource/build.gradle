plugins {
	id 'java'
	id 'application'
	id 'com.google.cloud.tools.jib'
}
version = '0.1.0'

description = 'Examples for showing resource detection in various GCP environments.'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'io.opentelemetry:opentelemetry-api:1.62.0'
	// Detects resource attributes from various GCP environments
	implementation 'io.opentelemetry.contrib:opentelemetry-gcp-resources:1.56.0-alpha'
	// Provides resources to the autoconfiguration module
	implementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:1.62.0'
}

mainClassName = 'com.google.cloud.opentelemetry.sample.resource.ResourceExample'

jib {
	from.image = 'gcr.io/distroless/java-debian10:11'
	containerizingMode = 'packaged'
}

def autoconf_config = [
	'-Dotel.traces.exporter=none',
	'-Dotel.metrics.exporter=none',
	'-Dotel.logs.exporter=none',
	'-Dotel.java.global-autoconfigure.enabled=true',
	'-Dotel.service.name=example-resource',
]

application {
	applicationDefaultJvmArgs = autoconf_config
}
