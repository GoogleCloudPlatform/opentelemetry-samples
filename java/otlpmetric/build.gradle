plugins {
	id 'java'
	id 'application'
}

version = '0.1.0'

mainClassName = 'com.google.cloud.opentelemetry.samples.otlpmetric.OTLPMetricExample'

description = 'Example for OTLP Metric exporter'

repositories {
	mavenCentral()
}

dependencies {
	implementation("io.opentelemetry:opentelemetry-api:1.62.0")
	implementation("io.opentelemetry:opentelemetry-sdk:1.62.0")
	implementation("io.opentelemetry:opentelemetry-exporter-otlp:1.62.0")
	implementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:1.62.0")
	implementation("io.opentelemetry.contrib:opentelemetry-gcp-resources:1.56.0-alpha")
	implementation("io.opentelemetry.contrib:opentelemetry-gcp-auth-extension:1.56.0-alpha")
	implementation("com.google.auth:google-auth-library-oauth2-http:1.27.0")
}

def autoconf_config = [
	'-Dotel.exporter.otlp.endpoint=https://telemetry.googleapis.com',
	'-Dgoogle.cloud.project=<YOUR_PROJECT_ID>',
	'-Dotel.metrics.exporter=otlp',
	'-Dotel.logs.exporter=none',
	'-Dotel.traces.exporter=none',
	'-Dotel.service.name=otlpmetrics-example',
	'-Dotel.exporter.otlp.protocol=http/protobuf',
	'-Dotel.java.global-autoconfigure.enabled=true',
]

application {
	mainClassName = 'com.google.cloud.opentelemetry.samples.otlpmetric.OTLPMetricExample'
	applicationDefaultJvmArgs = autoconf_config
}
