plugins {
	id 'java'
	id 'com.github.johnrengelman.shadow'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

version = '0.1.0'

repositories {
	mavenCentral()
}

configurations {
	invoker
}

dependencies {
	implementation 'com.google.cloud.functions:functions-framework-api:1.0.4'
	implementation 'io.opentelemetry:opentelemetry-api:1.62.0'
	implementation 'io.opentelemetry:opentelemetry-sdk-metrics:1.62.0'

	// required by resource detection
	implementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.62.0'
	// resource detection module
	implementation 'io.opentelemetry.contrib:opentelemetry-gcp-resources:1.56.0-alpha'

	implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.62.0'
	implementation 'io.opentelemetry:opentelemetry-exporter-logging:1.62.0'

	// For testing functions locally
	invoker 'com.google.cloud.functions.invoker:java-function-invoker:1.1.1'
}

jar {
	manifest {
		doFirst {
			attributes 'Class-Path': files(configurations.runtimeClasspath).asPath
		}
	}
}

tasks.named('shadowJar', ShadowJar) {
	archivesBaseName = 'hello-world-function'
	archiveClassifier = ''
	archiveVersion = ''
	destinationDirectory.set(file('out/deployment/'))
}

clean {
	doLast {
		println "Deleting previous output..."
		project.delete(files('out'))
	}
}

// Task only used to test the function locally
tasks.register('runFunction', JavaExec) {
	mainClass = 'com.google.cloud.functions.invoker.runner.Invoker'
	classpath(configurations.invoker)
	inputs.files(configurations.runtimeClasspath, sourceSets.main.output)
	args(
			'--target', project.findProperty('run.functionTarget'),
			'--port', project.findProperty('run.port') ?: 8080
			)
	doFirst {
		args('--classpath', files(configurations.runtimeClasspath, sourceSets.main.output).asPath)
	}
}

test {
	useJUnitPlatform()
}
